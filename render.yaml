# Render Blueprint for the frontend static site.
# If you configured the service in the Render dashboard instead, add the same
# rewrite there: Redirects/Rewrites -> Source /*  Destination /index.html  Action Rewrite
services:
  - type: web
    runtime: static
    name: union-hrms-workspace-f
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
